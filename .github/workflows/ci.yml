name: Build & Test (Windows .NET 4.8)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Automated Unit Tests (.NET 4.8)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\test.ps1

      - name: Build Executable & Release Package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Package

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIUsageWatcher-dist
          path: |
            dist/AIUsageWatcher.exe
            dist/AIUsageWatcher-*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AIUsageWatcher.exe
            dist/AIUsageWatcher-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
